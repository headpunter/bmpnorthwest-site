<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;112.5,700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:32px;background:#F7F8F9;font-family:Archivo,sans-serif;color:#16222B;
 background-image:linear-gradient(#e3e8ec 1px,transparent 1px),linear-gradient(90deg,#e3e8ec 1px,transparent 1px);background-size:24px 24px}
.row{display:grid;grid-template-columns:40px 160px 1fr 120px;gap:28px;align-items:center;padding:24px;border:1.5px solid #16222B;background:#F7F8F9;margin-bottom:20px}
.n{font-weight:700;font-size:28px;color:#E5641F}
.big img{width:140px;height:140px;display:block}
.lock{display:flex;align-items:center;gap:14px}
.lock img{width:52px;height:52px}
.word b{display:block;font-size:22px;font-variation-settings:"wdth" 112.5;letter-spacing:.04em}
.word span{font-size:12px;letter-spacing:.32em;color:#5B6B77}
.dark{background:#243441;padding:14px;display:flex;gap:12px;align-items:center;margin-top:14px}
.dark .word b{color:#fff}.dark .word span{color:#9FB0BC}.dark img{width:40px;height:40px}
.small{display:flex;gap:14px;align-items:flex-end}
.small img:nth-child(1){width:32px}.small img:nth-child(2){width:16px}
</style></head><body>
<div class="row"><div class="n">1</div><div class="big"><img src="1-section-detail.svg"></div>
<div><div class="lock"><img src="1-section-detail.svg"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div>
<div class="dark"><img src="1-section-detail.svg"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div></div>
<div class="small"><img src="1-section-detail.svg"><img src="1-section-detail.svg"></div></div>
<div class="row"><div class="n">2</div><div class="big"><img src="2-fence-elevation.svg"></div>
<div><div class="lock"><img src="2-fence-elevation.svg"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div>
<div class="dark"><img src="2-fence-elevation.svg"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div></div>
<div class="small"><img src="2-fence-elevation.svg"><img src="2-fence-elevation.svg"></div></div>
<div class="row"><div class="n">3</div><div class="big"><img src="3-detail-callout.svg"></div>
<div><div class="lock"><img src="3-detail-callout.svg"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div>
<div class="dark"><img src="3-detail-callout.svg"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div></div>
<div class="small"><img src="3-detail-callout.svg"><img src="3-detail-callout.svg"></div></div>
</body></html>
