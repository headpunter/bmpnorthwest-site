<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;112.5,700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:28px;font-family:Archivo,sans-serif;color:#16222B;background:#F7F8F9;
 background-image:linear-gradient(#e3e8ec 1px,transparent 1px),linear-gradient(90deg,#e3e8ec 1px,transparent 1px);background-size:24px 24px}
img{image-rendering:pixelated;display:block}
.row{display:grid;grid-template-columns:30px 176px 1fr 90px;gap:26px;align-items:center;padding:20px;border:1.5px solid #16222B;background:#F7F8F9;margin-bottom:18px}
.n{font-weight:700;font-size:26px;color:#E5641F}
.lock{display:flex;align-items:center;gap:14px}
.word b{display:block;font-size:22px;font-variation-settings:"wdth" 112.5;letter-spacing:.04em}
.word span{font-size:12px;letter-spacing:.32em;color:#5B6B77}
.dark{background:#243441;padding:14px;display:flex;gap:12px;align-items:center;margin-top:12px}
.dark .word b{color:#fff}.dark .word span{color:#9FB0BC}
.small{display:flex;gap:14px;align-items:flex-end}
</style></head><body>
<div class="row"><div class="n">A</div><img src="pix-A-fence.svg" width="176" height="176">
<div><div class="lock"><img src="pix-A-fence.svg" width="56" height="56"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div>
<div class="dark"><img src="pix-A-fence.svg" width="48" height="48"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div></div>
<div class="small"><img src="pix-A-fence.svg" width="32" height="32"><img src="pix-A-fence.svg" width="16" height="16"></div></div>
<div class="row"><div class="n">B</div><img src="pix-B-fence-wide.svg" width="176" height="176">
<div><div class="lock"><img src="pix-B-fence-wide.svg" width="56" height="56"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div>
<div class="dark"><img src="pix-B-fence-wide.svg" width="48" height="48"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div></div>
<div class="small"><img src="pix-B-fence-wide.svg" width="32" height="32"><img src="pix-B-fence-wide.svg" width="16" height="16"></div></div>
<div class="row"><div class="n">C</div><img src="pix-C-tile.svg" width="176" height="176">
<div><div class="lock"><img src="pix-C-tile.svg" width="56" height="56"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div>
<div class="dark"><img src="pix-C-tile.svg" width="48" height="48"><div class="word"><b>BMP NORTHWEST</b><span>CONSULTING</span></div></div></div>
<div class="small"><img src="pix-C-tile.svg" width="32" height="32"><img src="pix-C-tile.svg" width="16" height="16"></div></div>
</body></html>
